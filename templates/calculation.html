{% extends 'base.html' %}

{% block head %}
<title>Calculadora</title>
{% endblock %}

{% block body %}

<div class="content">
    <h1>Cálculos</h1>

    <form action="/calculation"  method="POST">
        <input type="number" name="diameter" id="diameter" placeholder="insira o diâmetro">
        <input type="number" name="cylindrical-length" id="cylindrical-length" placeholder="comprimento">
        <input type="submit" value="Calcular">

        <label for="volume">Volume:</label>
        <input type="number" id="volume" value="{{ volume }}" readonly>


    </form>

</div> 

{% endblock %}
